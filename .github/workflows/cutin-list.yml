# cutin_images/ や stages/ に画像を追加・削除したら、アプリが読む一覧（list.json）を自動で作り直す
name: 画像の一覧を更新
on:
  push:
    paths: ['cutin_images/**', 'stages/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: カットイン画像の一覧を作る
        run: |
          cd cutin_images
          ls -1 | grep -iE '\.(png|jpe?g|webp|gif)$' | sort | jq -R . | jq -s --indent 1 . > list.json
          cat list.json
      - name: ステージ画像の一覧を作る（{"sea": ["bg.jpg", "cutin/1.jpg", ...], ...}）
        run: |
          cd stages
          find . -mindepth 2 -type f | grep -iE '\.(png|jpe?g|webp|gif)$' | sed 's|^\./||' | sort | jq -R . \
            | jq -s --indent 1 'reduce .[] as $p ({}; ($p | split("/")) as $s | .[$s[0]] += [$s[1:] | join("/")])' > list.json
          cat list.json
      - name: 変わっていればコミットして、公開ページを作り直す
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add cutin_images/list.json stages/list.json
          if git diff --cached --quiet; then echo "一覧に変更なし"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "画像の一覧を更新"
          git push
          # Actions からの push では公開ページが作り直されないため、明示的に依頼する
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
