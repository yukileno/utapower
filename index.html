<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>うたパワー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0620;--ink:#fff;--sub:#d6d0ff;--pink:#ff4fd8;--cyan:#3ff6ff;--yel:#ffe14d;--grn:#5dff8a;--red:#ff4d6d;--panel:rgba(22,12,58,.78);--line:rgba(255,255,255,.2);
  /* 画面の大きさに合わせた基準の単位（1280×760 のとき 1px）。小さい Chromebook でも全体が収まる */
  --u:min(calc(100vw / 1280),calc(100vh / 760))}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'M PLUS Rounded 1c',system-ui,sans-serif;overflow:hidden}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:calc(var(--u) * 16);padding:calc(var(--u) * 14);z-index:2;overflow-y:auto;overflow-x:hidden}
.screen.on{display:flex}
/* タイトルロゴ：金色の立体文字＋光のすじ */
.logoWrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u) * 10)}
.logo{font-family:'Dela Gothic One',sans-serif;font-size:calc(var(--u) * 150);line-height:1.1;display:flex;
  filter:drop-shadow(0 calc(var(--u) * 5) 0 #c2168f) drop-shadow(0 calc(var(--u) * 10) 0 #5a0d80) drop-shadow(0 0 calc(var(--u) * 34) rgba(255,190,60,.75))}
.logo span{display:inline-block;background:linear-gradient(115deg,#fff6c2 0%,#ffe066 22%,#ffb300 40%,#fff 48%,#ffb300 56%,#ff5fd2 78%,#9a5bff 100%);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:bob 1.2s ease-in-out infinite,gleam 3s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(calc(var(--u) * -16)) rotate(4deg)}}
@keyframes gleam{from{background-position:100% 0}to{background-position:-50% 0}}
.note{position:absolute;font-size:calc(var(--u) * 54);color:#fff;text-shadow:0 0 calc(var(--u) * 18) #3ff6ff,0 0 calc(var(--u) * 36) #ff4fd8;animation:float 2.4s ease-in-out infinite}
.note.l{left:calc(var(--u) * -70);top:calc(var(--u) * 20)}
.note.r{right:calc(var(--u) * -70);top:calc(var(--u) * 40);animation-delay:-1.2s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-12deg) scale(1)}50%{transform:translateY(calc(var(--u) * -20)) rotate(12deg) scale(1.15)}}
.ribbon{font-size:calc(var(--u) * 26);font-weight:900;color:#fff;text-align:center;padding:calc(var(--u) * 6) calc(var(--u) * 40);position:relative;
  background:linear-gradient(90deg,transparent,rgba(255,79,216,.85) 12%,rgba(123,92,255,.9) 50%,rgba(63,246,255,.85) 88%,transparent);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.tag{font-size:calc(var(--u) * 26);font-weight:900;color:var(--cyan);text-shadow:0 0 16px rgba(63,246,255,.8);text-align:center}
.card{background:var(--panel);border:2px solid var(--line);border-radius:calc(var(--u) * 26);padding:calc(var(--u) * 18) calc(var(--u) * 28);backdrop-filter:blur(6px);box-shadow:0 0 50px rgba(123,92,255,.4)}
.goldCard{border:2px solid rgba(255,214,90,.55);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 0 50px rgba(255,180,60,.25),0 0 80px rgba(123,92,255,.35)}
.row{display:flex;gap:calc(var(--u) * 14);align-items:center;flex-wrap:wrap;justify-content:center}
.btn{font-family:'Dela Gothic One',sans-serif;font-size:max(22px,calc(var(--u) * 52));color:#fff;border:3px solid #fff3b0;border-radius:999px;padding:.25em 1.5em;cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(90deg,#ff4fd8,#ff9a3c,#ffe14d);box-shadow:0 calc(var(--u) * 8) 0 #9b1f86,0 0 44px rgba(255,79,216,.75),0 0 90px rgba(255,200,80,.35);text-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 #9b1f86}
.btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:shine 2.2s infinite}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
.btn.big{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.btn2{font:inherit;font-weight:900;font-size:max(15px,calc(var(--u) * 20));color:#fff;background:rgba(255,255,255,.1);border:2px solid var(--line);border-radius:999px;padding:calc(var(--u) * 9) calc(var(--u) * 24);cursor:pointer}
.btn2:hover{background:rgba(255,255,255,.22)}
.btn2.danger{border-color:rgba(255,77,109,.6);color:#ffb3c1}
.hint{min-height:1.4em;font-weight:800;color:#ffb3c1;text-align:center;font-size:max(14px,calc(var(--u) * 18))}
.hint:empty{display:none}
.small{font-size:15px;color:var(--sub);font-weight:500}
#stopBtn{position:fixed;right:calc(var(--u) * 20);bottom:calc(var(--u) * 16);z-index:3;display:none;opacity:.75}
#stopBtn.on{display:block}
/* result */
.rtitle{font-family:'Dela Gothic One',sans-serif;font-size:calc(var(--u) * 70);line-height:1.1;background:linear-gradient(90deg,#ffe14d,#ff4fd8,#3ff6ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(255,225,77,.6));animation:pulse 1.4s ease-in-out infinite}
.rcard{width:min(1100px,94vw);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u) * 4)}
.rballs{display:flex;flex-wrap:wrap;gap:calc(var(--u) * 7);justify-content:center;max-height:calc(var(--u) * 96);overflow:hidden}
.rb{width:calc(var(--u) * 44);height:calc(var(--u) * 44);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--c) 30%,var(--c) 58%,#1a0c3a 115%);box-shadow:0 0 16px var(--c);animation:popin .55s cubic-bezier(.3,1.8,.5,1) both}
.rb.gold{width:calc(var(--u) * 54);height:calc(var(--u) * 54);box-shadow:0 0 28px #ffd54a,0 0 60px #fff3}
@keyframes popin{from{transform:scale(0) rotate(-200deg);opacity:0}to{transform:scale(1) rotate(0)}}
.rnum{font-family:'Dela Gothic One',sans-serif;font-size:calc(var(--u) * 108);line-height:1;color:#fff;text-shadow:0 0 30px #ff4fd8,0 calc(var(--u) * 6) 0 #7b1f86}
.rnum small{font-size:.35em;margin-left:.2em}
.stats{display:flex;gap:calc(var(--u) * 16);flex-wrap:wrap;justify-content:center}
.stat{background:rgba(255,255,255,.08);border-radius:calc(var(--u) * 18);padding:calc(var(--u) * 8) calc(var(--u) * 22);text-align:center;min-width:calc(var(--u) * 170)}
.stat b{display:block;font-family:'Dela Gothic One',sans-serif;font-size:calc(var(--u) * 38);color:var(--yel)}
.stat span{font-weight:800;color:var(--sub);font-size:max(12px,calc(var(--u) * 16))}
.cmp{font-weight:900;font-size:calc(var(--u) * 30);text-align:center;line-height:1.45}
.cmp .up{color:var(--grn);text-shadow:0 0 14px rgba(93,255,138,.7)}
.cmp .dn{color:#ffb3c1}
.cmp .sub{font-size:.62em;color:var(--sub);font-weight:800}
#rSend{font-size:max(12px,calc(var(--u) * 15))}
#rSend:empty{display:none}
/* records */
.h2{font-family:'Dela Gothic One',sans-serif;font-size:calc(var(--u) * 56);line-height:1.1;text-shadow:0 0 22px rgba(63,246,255,.7)}
.wide{width:min(1200px,96vw);display:flex;flex-direction:column;gap:calc(var(--u) * 14)}
.chart{display:flex;align-items:flex-end;gap:10px;height:calc(var(--u) * 230);padding:calc(var(--u) * 26) 8px 0;border-bottom:2px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar .v{font-family:'Dela Gothic One',sans-serif;font-size:max(14px,calc(var(--u) * 22));margin-bottom:4px}
.bar .b{flex-shrink:0;width:100%;max-width:70px;border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,#ff4fd8,#7b5cff);box-shadow:0 0 18px rgba(255,79,216,.5);transform-origin:bottom;animation:grow .7s cubic-bezier(.3,1.5,.5,1) both}
.bar.today .b{background:linear-gradient(180deg,#ffe14d,#ff9a3c);box-shadow:0 0 22px rgba(255,225,77,.7)}
.bar .d{font-weight:800;font-size:max(12px,calc(var(--u) * 15));color:var(--sub);margin-top:6px;white-space:nowrap}
@keyframes grow{from{transform:scaleY(0)}}
.cap{font-weight:800;color:var(--sub);text-align:center;font-size:max(13px,calc(var(--u) * 17))}
.tblwrap{max-height:calc(var(--u) * 220);overflow:auto}
table{width:100%;border-collapse:collapse;font-weight:800;font-size:max(13px,calc(var(--u) * 17))}
th,td{padding:calc(var(--u) * 7) 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{color:var(--sub);position:sticky;top:0;background:#1d1046}
/* class select */
.clsBtn{font-family:'Dela Gothic One',sans-serif;font-size:max(20px,calc(var(--u) * 40));color:#fff;min-width:3.3em;padding:.2em .55em;border-radius:calc(var(--u) * 22);border:3px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));cursor:pointer;transition:transform .12s}
.clsBtn:hover{transform:translateY(-3px)}
.clsBtn.on{border-color:#fff3b0;background:linear-gradient(135deg,#3ff6ff,#7b5cff 55%,#ff4fd8);box-shadow:0 0 34px rgba(63,246,255,.8),0 0 0 3px rgba(255,214,90,.5);transform:scale(1.12);animation:pulse 1s ease-in-out infinite}
.btn:disabled{filter:grayscale(1) brightness(.6);animation:none;cursor:default;box-shadow:0 calc(var(--u) * 8) 0 #444;border-color:#999}
.btn:disabled::after{display:none}
/* マイク感度（プレイ中に ↑↓ キーか ＋− ボタンで変える） */
#sensBox{position:fixed;left:calc(var(--u) * 20);bottom:calc(var(--u) * 16);z-index:3;display:none;align-items:center;gap:calc(var(--u) * 8);opacity:.6;transition:opacity .3s;font-weight:900;font-size:max(13px,calc(var(--u) * 17))}
#sensBox.on{display:flex}
#sensBox:hover,#sensBox.hot{opacity:1}
#sensBox b{font-family:'Dela Gothic One',sans-serif;font-size:1.4em;color:var(--yel);display:inline-block;min-width:1.6em;text-align:center}
#sensBox .btn2{padding:calc(var(--u) * 4) calc(var(--u) * 16)}
#sensBox small{color:var(--sub);font-weight:800}
/* ranking */
.tab{font-family:'Dela Gothic One',sans-serif;font-size:max(16px,calc(var(--u) * 26));color:#fff;background:rgba(255,255,255,.08);border:2px solid var(--line);border-radius:999px;padding:calc(var(--u) * 5) calc(var(--u) * 28);cursor:pointer}
.tab.on{background:linear-gradient(90deg,#ff4fd8,#7b5cff);border-color:transparent;box-shadow:0 0 24px rgba(255,79,216,.6)}
#rankBox{gap:calc(var(--u) * 10)}
.rk{display:grid;grid-template-columns:calc(var(--u) * 72) calc(var(--u) * 120) 1fr calc(var(--u) * 150);align-items:center;gap:calc(var(--u) * 16);padding:calc(var(--u) * 7) calc(var(--u) * 18);border-radius:calc(var(--u) * 20);background:rgba(255,255,255,.06);animation:slidein .6s cubic-bezier(.3,1.4,.5,1) both}
.rk.me{background:rgba(63,246,255,.14);box-shadow:0 0 0 3px #3ff6ff,0 0 30px rgba(63,246,255,.5)}
@keyframes slidein{from{transform:translateX(-80px);opacity:0}}
.medal{width:calc(var(--u) * 58);height:calc(var(--u) * 58);border-radius:50%;display:grid;place-items:center;font-family:'Dela Gothic One',sans-serif;font-size:calc(var(--u) * 30);color:#3a2200;background:radial-gradient(circle at 35% 30%,#fff,#aaa 45%,#666);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.medal.m1{background:radial-gradient(circle at 35% 30%,#fff,#ffd54a 40%,#c98a00);box-shadow:0 0 30px #ffd54a;animation:pulse 1s ease-in-out infinite}
.medal.m2{background:radial-gradient(circle at 35% 30%,#fff,#dfe6f0 40%,#8a98ab)}
.medal.m3{background:radial-gradient(circle at 35% 30%,#fff,#ffb27a 40%,#a4561c)}
.medal.mx{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.rk .c{font-family:'Dela Gothic One',sans-serif;font-size:calc(var(--u) * 38)}
.rk .track{height:calc(var(--u) * 28);border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden}
.rk .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#3ff6ff,#ff4fd8,#ffe14d);transform-origin:left;animation:growx 1.2s cubic-bezier(.3,1.2,.5,1) both}
@keyframes growx{from{transform:scaleX(0)}}
.rk .n{text-align:right;font-family:'Dela Gothic One',sans-serif;font-size:calc(var(--u) * 38);line-height:1}
@media(max-width:700px){.rk{grid-template-columns:64px 1fr auto}.rk .track{display:none}}
.rk .n small{display:block;font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:max(11px,calc(var(--u) * 15));color:var(--sub)}
/* みための モード */
.themeRow{gap:calc(var(--u) * 12)}
.themeBtn{font-family:'Dela Gothic One',sans-serif;font-size:max(14px,calc(var(--u) * 24));color:#fff;padding:.15em .9em;border-radius:999px;border:2px solid var(--line);background:rgba(255,255,255,.06);cursor:pointer}
.themeBtn.on{border-color:transparent;background:linear-gradient(90deg,#ff4fd8,#7b5cff);box-shadow:0 0 20px rgba(255,79,216,.6)}
.themeBtn.on[data-t="live"]{background:linear-gradient(90deg,#ff4f5e,#3ff6ff);box-shadow:0 0 20px rgba(63,246,255,.6)}
/* stages */
.stageRow{display:flex;align-items:center;gap:calc(var(--u) * 8);flex-wrap:wrap;justify-content:center;font-weight:900;font-size:max(12px,calc(var(--u) * 18))}
.schip{padding:calc(var(--u) * 3) calc(var(--u) * 14);border-radius:999px;border:2px solid var(--a);background:rgba(0,0,0,.35);box-shadow:0 0 14px var(--a)}
.sarrow{color:var(--sub);font-size:.8em}
#rStage{font-size:calc(var(--u) * 22)}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- タイトル -->
<div id="title" class="screen on">
  <div class="logoWrap">
    <span class="note l">♪</span><span class="note r">♫</span>
    <div class="logo" id="logo"></div>
    <div class="ribbon">みんなの うたごえで パワーをためて、玉を ゲットしよう！</div>
    <div class="stageRow" id="stageRow"></div>
  </div>
  <div class="row themeRow"><span class="cap">みため</span><span id="themeBtns" class="row"></span></div>
  <div class="card goldCard">
    <div class="cap" style="margin-bottom:calc(var(--u) * 12)">クラスを えらんでね</div>
    <div class="row" id="clsBtns"></div>
  </div>
  <button class="btn big" id="startBtn" disabled>スタート！</button>
  <div class="row"><button class="btn2" id="rankBtn">ランキング</button><button class="btn2" id="recBtn">きろく</button></div>
  <div class="hint" id="tHint"></div>
</div>

<!-- けっか -->
<div id="result" class="screen">
  <div class="rtitle" id="rTitle">けっか はっぴょう！</div>
  <div class="card rcard">
    <div class="rballs" id="rBalls"></div>
    <div class="rnum"><span id="rBallN">0</span><small>こ ゲット！</small></div>
    <div class="cmp" id="rStage"></div>
    <div class="stats">
      <div class="stat"><b id="rScore">0</b><span>とくてん</span></div>
      <div class="stat"><b id="rCombo">0</b><span>さいだいコンボ</span></div>
      <div class="stat"><b id="rRatio">0%</b><span>うたっていた時間</span></div>
    </div>
    <div class="cmp" id="rCmp"></div>
    <div class="small" id="rSend"></div>
  </div>
  <div class="row"><button class="btn" id="againBtn">もういちど！</button><button class="btn2" id="rRank">ランキング</button><button class="btn2" id="rRec">きろくを見る</button><button class="btn2" id="rTitleBtn">タイトルへ</button></div>
</div>

<!-- ランキング -->
<div id="ranking" class="screen">
  <div class="h2">こんしゅうの クラス ランキング</div>
  <div class="card wide" id="rankBox"></div>
  <div class="cap" id="rankNote"></div>
  <div class="row"><button class="btn2" id="rankReload">さいしんにする</button><button class="btn2" id="rankBack">もどる</button></div>
</div>

<!-- きろく -->
<div id="records" class="screen">
  <div class="h2">きろく</div>
  <div class="row" id="recTabs"></div>
  <div class="card wide">
    <div class="cap" id="chartCap"></div>
    <div class="chart" id="chart"></div>
    <div class="tblwrap"><table id="recTbl"></table></div>
  </div>
  <div class="row"><button class="btn2" id="recBack">もどる</button></div>
</div>

<button class="btn2" id="stopBtn">おわる ■</button>
<div id="sensBox"><span>マイク感度 <b id="sensN"></b></span><button class="btn2" id="sensDn" title="反応ひかえめに（↓キー）">−</button><button class="btn2" id="sensUp" title="よく反応するように（↑キー）">＋</button><small>↑↓キーでも かえられます</small></div>

<script>
'use strict';
// ================= util =================
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
function today(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function hhmm(){const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
const easeOutBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};

// むずかしさは いまは「ふつう」だけ。ほかは むかしの記録を表示するために残している
const DIFF={easy:{name:'かんたん',cost:8},normal:{name:'ふつう',cost:12},hard:{name:'むずかしい',cost:18}};
const CLASSES=['1組','2組','3組','4組','5組'];
const BALL_COLORS=['#ff4f81','#ffb13d','#ffe14d','#5dff8a','#3ff6ff','#5c8bff','#b45cff','#ff4fd8','#ff7a3c'];
const GOLD='#ffd54a';

// ================= ステージ =================
// 玉を10こ（金の玉まで）あつめるごとに つぎの せかいへ。5つめの あとは 1つめに もどる
// hue:null は いままでどおり色が ぐるぐる変わる。数字なら その色を中心に hueR だけ ゆれる
// stars:true のステージは 星が とんでくる背景になる
// みための モードは タイトルで えらぶ。kira=これまでの かわいい絵、live=高学年むけの ライブツアー
const THEMES={
 kira:{name:'キラキラ',cutBase:true,stages:[
  {id:'space',name:'うちゅうの せかい',short:'うちゅう',accent:'#b45cff',hue:null,stars:true,balls:BALL_COLORS},
  {id:'sea',name:'うみの せかい',short:'うみ',accent:'#3ff6ff',hue:195,hueR:25,span:120,sat:80,light:[22,6],
    balls:['#7ff6ff','#4fc3ff','#d6fbff','#5dffd2','#a8b6ff','#3ff6ff','#9fe8ff'],
    get:['ぷくぷく!!','ゲット!!','ナイス!!','すごい!!','いいね!!'],
    words:{1:['なみに のって!!','あわあわ ハーモニー!!','イルカも ノリノリ!!','うみの そこまで とどけ!!'],
      2:['おおなみ ザッパーン!!','クジラも びっくり!!','うみの みんなが あつまった!!','しんかい パワー MAX!!']}},
  {id:'flower',name:'おはなばたけの せかい',short:'おはなばたけ',accent:'#ff7ab8',hue:330,hueR:35,span:160,sat:75,light:[24,7],
    balls:['#ff7ab8','#ffb3d9','#ffe14d','#ff9a3c','#c38bff','#7dff9a','#ff5f8f'],
    get:['さいた!!','ゲット!!','かわいい!!','ナイス!!','すてき!!'],
    words:{1:['おはなが さいたよ!!','ちょうちょも おどる!!','ぽかぽか ハーモニー!!','いい かおり!!'],

const A={ctx:null,an:null,tbuf:null,fbuf:null,ready:false,db:-100,raw:0,lvl:0,floor:-60,freq:null};

let demoHold=0; // 0:なし 1:歌う 2:大きすぎ（Shift＋スペース）
async function initMic(){
  if(A.ready){if(A.ctx.state==='suspended')await A.ctx.resume();return true}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    A.ctx=new (window.AudioContext||window.webkitAudioContext)();
    const src=A.ctx.createMediaStreamSource(st);
    A.an=A.ctx.createAnalyser();A.an.fftSize=2048;A.an.smoothingTimeConstant=.7;
    src.connect(A.an);
    A.tbuf=new Float32Array(A.an.fftSize);A.fbuf=new Uint8Array(A.an.frequencyBinCount);
    A.ready=true;return true;
  }catch(e){console.warn(e);return false}
}
const demoFreq=new Uint8Array(1024);
function sampleAudio(dt,t){
  if(A.ready){
    A.an.getFloatTimeDomainData(A.tbuf);
    let s=0;for(let i=0;i<A.tbuf.length;i++)s+=A.tbuf[i]*A.tbuf[i];
    A.db=10*Math.log10(s/A.tbuf.length+1e-12);
    A.an.getByteFrequencyData(A.fbuf);A.freq=A.fbuf;
    A.raw=(A.db-(A.floor+6))/cfg.range;
  }else{A.db=-100;A.raw=-1;A.freq=null}
  if(demoHold){
    // マイクの音は使わず「ちょうどいい」（Shift なら「大きすぎ」）の声の大きさにする
    A.raw=demoHold===2?1.05+rand(-.03,.03):.6+Math.sin(t*3)*.08+rand(-.04,.04);
    for(let i=0;i<demoFreq.length;i++)demoFreq[i]=clamp(230*Math.exp(-i/110)*(.55+.45*Math.sin(i*.35+t*9))*(demoHold===2?1.15:.85),0,255);
    A.freq=demoFreq;
  }
  const tgt=clamp(A.raw,0,Z.max);
  A.lvl+=(tgt-A.lvl)*(1-Math.exp(-dt*(tgt>A.lvl?12:5)));
}
function gainOf(l){
  if(l<Z.low)return 0;
  if(l<Z.good)return .3+.7*(l-Z.low)/(Z.good-Z.low);
  if(l<=Z.loud)return 1;
  return .25;
}

function drawCutins(t){

    const off=p<inT?(1-easeOutBack(p/inT))*W*1.1:p>c.dur-outT?-(1-a)*W*1.3:0;
    const col=c.lvl===1?'#3ff6ff':c.lvl===2?'#ff4fd8':'#ffe14d';

    g.save();path();g.clip();
    if(c.img){

    g.restore();
    // 窓のふち
    g.lineJoin='round';path();g.lineWidth=14*U;g.strokeStyle=col;g.stroke();path();g.lineWidth=4*U;g.strokeStyle='#fff';g.stroke();
    // 稲妻（強いときだけ）
    if(c.lvl>=2&&a>.5&&Math.random()<.35){g.save();g.globalCompositeOperation='lighter';g.strokeStyle='#fff6d0';g.shadowColor='#fff';g.shadowBlur=20;
      const bx=rand(W*.1,W*.9);drawBolt(bx,0,bx+rand(-120,120)*U,cy-wh/2,rand(3,6)*U);g.restore()}
    // 文字（窓の下のふちに重ねる）

    g.save();g.translate(cx-ww*.04+(c.lvl>=2?rand(-3,3)*U:0),cy+wh/2);g.rotate(-.06);
    const pop=p<inT+.15?1+.25*Math.sin(Math.min(1,Math.max(0,p-inT)/.15)*Math.PI):1;g.scale(pop,pop);
    g.textAlign='center';g.textBaseline='middle';g.font=`${Math.round(sz)}px 'Dela Gothic One',sans-serif`;
    const tw=g.measureText(c.text).width,maxW=ww*.95;

    g.lineWidth=sz*.09;g.strokeStyle=col;g.strokeText(c.text,0,0);

function drawBeams(t,inPlay,cols,n,narrow,fromTop){

  const mx=Math.max(1,...vals),td=today();
  $('#chartCap').textContent=`${cls}　1日の ベスト玉数（さいきん14日）${note}`;
  $('#chart').innerHTML=dates.length?dates.map((d,i)=>{const[,m,dd]=d.split('-');return `<div class="bar${d===td?' today':''}"><div class="v">${vals[i]}${vals[i]===mx?'★':''}</div><div class="b" style="height:${Math.max(3,vals[i]/mx*70)}%;animation-delay:${i*50}ms"></div><div class="d">${d===td?'きょう':(+m)+'/'+(+dd)}</div></div>`}).join(''):'<div class="cap" style="margin:auto">まだ きろくが ありません</div>';
  $('#recTbl').innerHTML='<tr><th>日づけ</th><th>時こく</th><th>玉</th><th>とくてん</th><th>最大コンボ</th><th>うたった割合</th><th>むずかしさ</th></tr>'+
    list.slice(0,200).map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.time)}</td><td>${r.balls}</td><td>${r.score.toLocaleString()}</td><td>${r.maxCombo}</td><td>${r.singRatio}%</td><td>${DIFF[r.diff]?DIFF[r.diff].name:esc(r.diff)}</td></tr>`).join('');
}

// ---- スプレッドシートへの保存（送れなかった分はページを開いている間だけ持っておき、次の機会に送る）
let pending=[],sending=false;
async function sendPending(){
  if(!pending.length)return 'none';
  if(sending)return 'busy';
  sending=true;const batch=pending.slice();
  try{
    // text/plain にすると Apps Script でも CORS の事前確認なしで送れて、応答も読める
    const j=await (await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(batch)})).json();
    if(!j.ok)throw new Error('save failed');
    pending=pending.filter(r=>!batch.includes(r));return 'ok';
  }catch(e){console.warn(e);return 'fail'}
  finally{sending=false}
}
addEventListener('beforeunload',e=>{if(pending.length){e.preventDefault();e.returnValue=''}});
let rankData=null;
async function openRanking(){
  show('ranking');fwRate=.5;fwT=0;
  $('#rankBox').innerHTML='<div class="cap">よみこみ中…</div>';$('#rankNote').textContent='';
  await sendPending();
  try{
    const res=await fetch(GAS_URL,{cache:'no-store'});
    rankData=await res.json();renderRanking();
  }catch(e){console.warn(e);$('#rankBox').innerHTML='<div class="cap">ランキングを よみこめませんでした。URLと ネットワークを 確認してください。</div>'}
}
function renderRanking(){
  if(!rankData)return;
  const list=rankData.week||[];
  const mx=Math.max(1,...list.map(r=>r.balls));
  let rank=0,prevKey=null;
  $('#rankBox').innerHTML=list.map((r,i)=>{
    const key=r.balls+'/'+r.score;if(key!==prevKey){rank=i+1;prevKey=key}
    const none=!r.balls&&!r.score;
    const mc=none?'mx':rank<=3?'m'+rank:'mx';
    return `<div class="rk${r.cls===curCls?' me':''}" style="animation-delay:${i*120}ms"><div class="medal ${mc}">${none?'−':rank}</div><div class="c">${esc(r.cls)}</div><div class="track"><div class="fill" style="width:${r.balls/mx*100}%;animation-delay:${300+i*120}ms"></div></div><div class="n">${r.balls}こ<small>${none?'まだ':r.days+'日 うたった'}</small></div></div>`;
  }).join('');
  if(list.length&&list[0].balls>0){burst(W*.5,H*.2,120,GOLD,true)}
  $('#rankNote').textContent=`こんしゅう（${rankData.weekStart.slice(5).replace('-','/')}〜）の 毎日のベストの ごうけいです　／ 更新 ${rankData.updated}`;
}

// ---- マイク感度（プレイ中に ↑↓ キーか ＋− ボタンで変える。全クラス共通でスプレッドシートに保存）
// range が小さいほど よく反応する。画面には 1〜20 の「感度」で出す
let rangeTouched=false,sensSaveT=null,sensHotT=null;
const sensLevel=()=>Math.round((50-cfg.range)/2)+1;
function renderSens(){$('#sensN').textContent=sensLevel()}
function changeSens(d){
  cfg.range=clamp(cfg.range-d*2,12,50);rangeTouched=true;renderSens();
  const b=$('#sensBox');b.classList.add('hot');clearTimeout(sensHotT);sensHotT=setTimeout(()=>b.classList.remove('hot'),1500);
  clearTimeout(sensSaveT);sensSaveT=setTimeout(saveSens,1500); // 続けて押している間は送らない
}
async function saveSens(){
  clearTimeout(sensSaveT);sensSaveT=null;
  try{
    const j=await (await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'saveSettings',settings:{range:cfg.range}})})).json();
    if(!j.ok)throw new Error(j.error||'save failed');
  }catch(e){console.warn(e)}
}

addEventListener('keydown',e=>{
  if(mode==='play'||mode==='count'){
    if(e.code==='Space'){e.preventDefault();demoHold=e.shiftKey?2:1}
    if(e.code==='Escape'||e.code==='Enter'){e.preventDefault();finish()}
    if(e.code==='ArrowUp'||e.code==='ArrowDown'){e.preventDefault();changeSens(e.code==='ArrowUp'?1:-1)}
  }else if(mode==='title'&&e.code==='Enter'){e.preventDefault();startGame()}
});
addEventListener('keyup',e=>{if(e.code==='Space')demoHold=0});
cv.addEventListener('pointerdown',()=>{if(mode==='play')demoHold=1});
addEventListener('pointerup',()=>{demoHold=0});
backTitle();
loadSettings();
